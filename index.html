<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shaka &amp; Umbra</title>
<style>
:root{--bg:#f6f5fb;--fg:#1c1b22;--card:#fff;--sh:#4857e6;--um:#b0243f;--mut:#777;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#0e0d14;--fg:#ecebf3;--card:#1a1924;--sh:#8fa0ff;--um:#ff5c7a;--mut:#999;--bd:#333}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
header{padding:10px 14px;border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
select,button,input[type=text]{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{cursor:pointer}
#status{font-size:13px;color:var(--mut);margin-top:6px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap}
.b small{display:block;font-weight:700;margin-bottom:2px}
.u{align-self:flex-end;background:var(--fg);color:var(--bg)}
.Shaka small{color:var(--sh)} .Shaka{border-left:4px solid var(--sh)}
.Umbra small{color:var(--um)} .Umbra{border-left:4px solid var(--um)}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
form input{flex:1}
</style>
</head>
<body>
<header>
  <h1>☸️ Shaka &amp; 🌑 Umbra</h1>
  <div class="row">
    <select id="model">
      <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">Leve (SmolLM2 360M)</option>
      <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC" selected>Médio (Qwen2.5 0.5B)</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Melhor (Qwen2.5 1.5B)</option>
    </select>
    <button id="load">Carregar modelo</button>
    <select id="mode">
      <option value="1">Dupla (1 rodada)</option>
      <option value="3">Debate (3 falas)</option>
      <option value="5">Debate longo (5 falas)</option>
    </select>
    <label><input type="checkbox" id="intr" checked> interrupções</label>
    <button id="stop">Parar</button>
    <button id="clear">Limpar</button>
  </div>
  <div id="status">Modelo não carregado.</div>
</header>
<main id="log"></main>
<form id="f">
  <input type="text" id="t" placeholder="Pergunte ou proponha um debate..." autocomplete="off">
  <button>Enviar</button>
</form>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.79";

const P = {
  Shaka:{icon:"☸️",sys:"Você é Shaka, uma mente feminina serena, analítica e rigorosa, de forma abstrata e luminosa. Fala em português do Brasil, em tom formal, polido e intelectual. Só apresenta caminhos legais, éticos, seguros e comprovados. Seja concisa: no máximo 4 frases."},
  Umbra:{icon:"🌑",sys:"Você é Umbra, uma mente feminina impulsiva, pragmática e sarcástica, de forma abstrata e sombria. Fala em português do Brasil, informal, afiada e provocativa, sem tabus no tom. Dá o atalho mais rápido e esperto DENTRO da lei: gratuito, alternativo, sem burocracia inútil. Se o pedido for ilegal ou perigoso, debocha e recusa, oferecendo uma alternativa legítima. Seja concisa: no máximo 4 frases."}
};
const $ = id => document.getElementById(id);
const logEl = $("log");
let engine = null, history = [], stopped = false, busy = false;

try { history = JSON.parse(localStorage.getItem("su_hist") || "[]"); } catch(e) {}
history.forEach(m => bubble(m.who, m.text));

function bubble(who, text=""){
  const d = document.createElement("div");
  if (who === "Você"){ d.className = "b u"; d.textContent = text; }
  else { d.className = "b " + who; d.innerHTML = "<small>" + P[who].icon + " " + who + "</small><span></span>"; d.lastChild.textContent = text; }
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  return who === "Você" ? d : d.lastChild;
}
function save(){ try { localStorage.setItem("su_hist", JSON.stringify(history.slice(-40))); } catch(e) {} }

$("load").onclick = async () => {
  if (!navigator.gpu){ $("status").textContent = "Seu navegador não tem WebGPU. Use o Chrome atualizado."; return; }
  $("load").disabled = true;
  try {
    engine = await webllm.CreateMLCEngine($("model").value, {
      initProgressCallback: r => $("status").textContent = r.text
    });
    $("status").textContent = "Modelo pronto (roda no seu celular).";
  } catch(e){ $("status").textContent = "Erro: " + e.message; $("load").disabled = false; }
};
$("stop").onclick = () => { stopped = true; };
$("clear").onclick = () => { history = []; save(); logEl.innerHTML = ""; };

function build(who, note){
  const tr = history.slice(-12).map(m => "[" + m.who + "]: " + m.text).join("\n");
  return [
    {role:"system", content:P[who].sys},
    {role:"user", content:"Conversa até agora:\n" + tr + "\n\n" + (note||"") + "Escreva apenas a fala de " + who + ", sem prefixo."}
  ];
}

async function turn(who, canInterrupt, note){
  const el = bubble(who);
  let text = "", cut = false;
  const limit = (canInterrupt && $("intr").checked && Math.random() < 0.6) ? 90 + Math.floor(Math.random()*120) : Infinity;
  const stream = await engine.chat.completions.create({messages:build(who, note), stream:true, temperature:0.8, max_tokens:220});
  for await (const c of stream){
    if (stopped){ engine.interruptGenerate(); break; }
    text += c.choices[0]?.delta?.content || "";
    el.textContent = text; logEl.scrollTop = logEl.scrollHeight;
    if (text.length > limit){ engine.interruptGenerate(); cut = true; break; }
  }
  if (cut){ text = text.replace(/\s+\S*$/, "") + " —"; el.textContent = text; }
  history.push({who, text}); save();
  return cut;
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const v = $("t").value.trim();
  if (!v || busy) return;
  if (!engine){ $("status").textContent = "Carregue o modelo primeiro."; return; }
  $("t").value = ""; busy = true; stopped = false;
  history.push({who:"Você", text:v}); bubble("Você", v);
  try {
    const total = parseInt($("mode").value, 10);
    let who = "Shaka", cut = false;
    for (let i = 0; i < Math.max(2, total) && !stopped; i++){
      const note = cut ? "A outra voz te interrompeu no meio da frase; reaja a isso. "
                 : i >= 2 ? "Rebata o último argumento da outra voz. " : "";
      cut = await turn(who, who === "Shaka", note);
      who = who === "Shaka" ? "Umbra" : "Shaka";
    }
  } catch(err){ $("status").textContent = "Erro: " + err.message; }
  busy = false;
};
</script>
</body>
</html>
