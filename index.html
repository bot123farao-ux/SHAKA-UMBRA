<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shaka &amp; Umbra</title>
<style>
:root{--bg:#f6f5fb;--fg:#1c1b22;--card:#fff;--sh:#4857e6;--um:#b0243f;--mut:#777;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#0e0d14;--fg:#ecebf3;--card:#1a1924;--sh:#8fa0ff;--um:#ff5c7a;--mut:#999;--bd:#333}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
header{padding:10px 14px;border-bottom:1px solid var(--bd);max-height:55vh;overflow-y:auto}
h1{font-size:18px;margin:0 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;margin-top:6px}
select,button,input[type=text],input[type=password]{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);max-width:100%}
button{cursor:pointer}
details{margin-top:6px;font-size:14px}
summary{cursor:pointer;color:var(--mut)}
.cfg{display:grid;gap:6px;margin-top:8px}
.cfg label{display:grid;gap:2px;font-size:13px;color:var(--mut)}
#status{font-size:13px;color:var(--mut);margin-top:6px;word-break:break-word}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.b{max-width:88%;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--bd);white-space:pre-wrap}
.b small{display:block;font-weight:700;margin-bottom:2px}
.u{align-self:flex-end;background:var(--fg);color:var(--bg)}
.Shaka small{color:var(--sh)} .Shaka{border-left:4px solid var(--sh)}
.Umbra small{color:var(--um)} .Umbra{border-left:4px solid var(--um)}
form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
form input{flex:1}
</style>
</head>
<body>
<header>
  <h1>☸️ Shaka &amp; 🌑 Umbra</h1>
  <div class="row">
    <select id="mode">
      <option value="2">Dupla (1 rodada)</option>
      <option value="4">Debate (4 falas)</option>
      <option value="6">Debate longo (6 falas)</option>
    </select>
    <label><input type="checkbox" id="intr" checked> interrupções</label>
    <button id="stop">Parar</button>
    <button id="clear">Limpar</button>
  </div>
  <details id="cfgbox">
    <summary>⚙️ Configurar IAs e chaves</summary>
    <div class="cfg">
      <label>Shaka: provedor
        <select id="pS"><option value="gemini">Gemini (Google AI Studio)</option><option value="openrouter">OpenRouter</option></select></label>
      <label>Shaka: modelo <input type="text" id="mS"></label>
      <label>Umbra: provedor
        <select id="pU"><option value="openrouter">OpenRouter</option><option value="gemini">Gemini (Google AI Studio)</option></select></label>
      <label>Umbra: modelo <input type="text" id="mU"></label>
      <label>Chave Gemini (aistudio.google.com) <input type="password" id="kG" autocomplete="off"></label>
      <label>Chave OpenRouter (openrouter.ai/keys) <input type="password" id="kO" autocomplete="off"></label>
      <button id="saveCfg" type="button">Salvar</button>
    </div>
  </details>
  <div id="status">Configure as chaves e comece a conversar.</div>
</header>
<main id="log"></main>
<form id="f">
  <input type="text" id="t" placeholder="Pergunte ou proponha um debate..." autocomplete="off">
  <button>Enviar</button>
</form>

<script>
const P = {
  Shaka:{icon:"☸️",sys:"Você é Shaka, uma mente feminina serena, analítica e rigorosa, de forma abstrata e luminosa. Fala em português do Brasil, em tom formal, polido e intelectual. Só apresenta caminhos legais, éticos, seguros e comprovados. Seja concisa: no máximo 4 frases."},
  Umbra:{icon:"🌑",sys:"Você é Umbra, uma mente feminina impulsiva, pragmática e sarcástica, de forma abstrata e sombria. Fala em português do Brasil, informal, afiada e provocativa, sem tabus no tom. Dá o atalho mais rápido e esperto DENTRO da lei: gratuito, alternativo, sem burocracia inútil. Se o pedido for ilegal ou perigoso, debocha e recusa, oferecendo uma alternativa legítima. Seja concisa: no máximo 4 frases."}
};
const DEF = {pS:"gemini", mS:"gemini-2.5-flash", pU:"openrouter", mU:"moonshotai/kimi-k2", kG:"", kO:""};
const $ = id => document.getElementById(id);
const logEl = $("log");
let history = [], stopped = false, busy = false, ctrl = null;

function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e) {} return null; }

// config
const cfg = {};
for (const k in DEF){ cfg[k] = ls("su_" + k) ?? DEF[k]; $(k).value = cfg[k]; }
if (!cfg.kG && !cfg.kO) $("cfgbox").open = true;
$("saveCfg").onclick = () => {
  for (const k in DEF){ cfg[k] = $(k).value.trim(); ls("su_" + k, cfg[k]); }
  $("status").textContent = "Configuração salva."; $("cfgbox").open = false;
};

try { history = JSON.parse(ls("su_hist") || "[]"); } catch(e) {}
history.forEach(m => bubble(m.who, m.text));

function bubble(who, text=""){
  const d = document.createElement("div");
  if (who === "Você"){ d.className = "b u"; d.textContent = text; }
  else { d.className = "b " + who; d.innerHTML = "<small>" + P[who].icon + " " + who + "</small><span></span>"; d.lastChild.textContent = text; }
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  return who === "Você" ? d : d.lastChild;
}
function save(){ ls("su_hist", JSON.stringify(history.slice(-40))); }
$("stop").onclick = () => { stopped = true; if (ctrl) ctrl.abort(); };
$("clear").onclick = () => { history = []; save(); logEl.innerHTML = ""; };

function userPrompt(who, note){
  const tr = history.slice(-12).map(m => "[" + m.who + "]: " + m.text).join("\n");
  return "Conversa até agora:\n" + tr + "\n\n" + (note||"") + "Escreva apenas a fala de " + who + ", sem prefixo.";
}

async function* sse(res){
  const r = res.body.getReader(), d = new TextDecoder();
  let buf = "";
  while (true){
    const {done, value} = await r.read();
    if (done) break;
    buf += d.decode(value, {stream:true});
    let i;
    while ((i = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line.startsWith("data:")){
        const s = line.slice(5).trim();
        if (s && s !== "[DONE]") yield s;
      }
    }
  }
}

async function* tokens(who, user, signal){
  const prov = who === "Shaka" ? cfg.pS : cfg.pU;
  const model = who === "Shaka" ? cfg.mS : cfg.mU;
  let res;
  if (prov === "gemini"){
    if (!cfg.kG) throw new Error("Falta a chave do Gemini.");
    res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":streamGenerateContent?alt=sse", {
      method:"POST", signal,
      headers:{"Content-Type":"application/json", "x-goog-api-key":cfg.kG},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:P[who].sys}]},
        contents:[{role:"user", parts:[{text:user}]}],
        generationConfig:{temperature:0.9, maxOutputTokens:1024}
      })
    });
  } else {
    if (!cfg.kO) throw new Error("Falta a chave do OpenRouter.");
    res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method:"POST", signal,
      headers:{"Content-Type":"application/json", "Authorization":"Bearer " + cfg.kO},
      body:JSON.stringify({
        model, stream:true, temperature:0.9, max_tokens:400,
        messages:[{role:"system", content:P[who].sys}, {role:"user", content:user}]
      })
    });
  }
  if (!res.ok){
    const t = await res.text();
    throw new Error(who + " (" + prov + ") HTTP " + res.status + ": " + t.slice(0, 200));
  }
  for await (const s of sse(res)){
    let j; try { j = JSON.parse(s); } catch(e) { continue; }
    const piece = prov === "gemini"
      ? (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("")
      : (j.choices?.[0]?.delta?.content || "");
    if (piece) yield piece;
  }
}

async function turn(who, canInterrupt, note){
  const el = bubble(who);
  let text = "", cut = false;
  const limit = (canInterrupt && $("intr").checked && Math.random() < 0.6) ? 90 + Math.floor(Math.random()*120) : Infinity;
  ctrl = new AbortController();
  try {
    for await (const piece of tokens(who, userPrompt(who, note), ctrl.signal)){
      text += piece; el.textContent = text; logEl.scrollTop = logEl.scrollHeight;
      if (text.length > limit){ cut = true; ctrl.abort(); break; }
    }
  } catch(e){
    if (e.name !== "AbortError") { el.textContent = text || "(sem resposta)"; throw e; }
  }
  if (cut){ text = text.replace(/\s+\S*$/, "") + " —"; el.textContent = text; }
  if (!text) { el.textContent = "(sem resposta)"; text = "(sem resposta)"; }
  history.push({who, text}); save();
  return cut;
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const v = $("t").value.trim();
  if (!v || busy) return;
  $("t").value = ""; busy = true; stopped = false;
  $("status").textContent = "";
  history.push({who:"Você", text:v}); bubble("Você", v);
  try {
    const total = parseInt($("mode").value, 10);
    let who = "Shaka", cut = false;
    for (let i = 0; i < total && !stopped; i++){
      const note = cut ? "A outra voz te interrompeu no meio da frase; reaja a isso. "
                 : i >= 2 ? "Rebata o último argumento da outra voz. " : "";
      cut = await turn(who, who === "Shaka", note);
      who = who === "Shaka" ? "Umbra" : "Shaka";
    }
  } catch(err){ $("status").textContent = "Erro: " + err.message; }
  busy = false;
};
</script>
</body>
</html>
